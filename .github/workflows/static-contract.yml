name: Quest static contract

on:
  push:
    branches: [main, feat/quest-body-diagnostic]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate pinned packages, identities, protocols, and test assemblies
        run: python3 scripts/verify_project_contract.py

      - name: Compile gate scripts
        run: python3 -m py_compile scripts/*.py
